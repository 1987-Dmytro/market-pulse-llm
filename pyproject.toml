[project]
name = "market-pulse-llm"
version = "0.1.0"
description = "Category Intelligence System for Ukrainian food retail (dairy + ice cream) — Telegram-only MVP"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
    "telethon>=1.44.0",
    "python-dotenv>=1.0.0",
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.22",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# These run as `python3.11 scripts/<name>.py` without the package installed, so they
# must extend sys.path before importing market_pulse.
"scripts/entry_check.py" = ["E402"]
"scripts/tg_login.py" = ["E402"]
