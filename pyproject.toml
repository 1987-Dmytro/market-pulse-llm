[project]
name = "market-pulse-llm"
version = "0.1.0"
description = "Category Intelligence System for Ukrainian food retail (dairy + ice cream) — Telegram-only MVP"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
    "telethon>=1.44.0",
    "python-dotenv>=1.0.0",
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.22",
]
# Only scripts/run_baseline.py needs these: hand-rolling TF-IDF + multinomial
# logreg would be numeric code the scorer then has to trust. `make check` stays
# green without them — no test imports sklearn.
baseline = [
    "scikit-learn>=1.5",
]
# Only scripts/train_xlmr_baseline.py needs these, and they are ~2.5 GB of wheels.
# Isolated exactly like `baseline`: no test imports torch or transformers, so
# `make check` stays green on a bare checkout.
xlmr = [
    "torch>=2.4",
    "transformers>=4.44",
]
# Only the Phase 4 GPU path needs these — `src/market_pulse/local_llm.py` and the
# runner's `--backend local`. Installed on the rented pod, never on this Mac (no
# CUDA, and bitsandbytes has no use for one). Isolated exactly like `baseline`
# and `xlmr`: no test imports them, so `make check` stays green on a bare
# checkout, and the imports live inside functions rather than at module scope.
# transformers >= 5.5 is not a preference: `google/gemma-4-31b-it` ships a
# `gemma4` config and a chat template that older releases cannot read.
gpu = [
    "torch>=2.6",
    "transformers>=5.5",
    "bitsandbytes>=0.45",
    "accelerate>=1.0",
    "peft>=0.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# These run as `python3.11 scripts/<name>.py` without the package installed, so they
# must extend sys.path before importing market_pulse.
"scripts/apply_review.py" = ["E402"]
"scripts/backfill.py" = ["E402"]
"scripts/check_synthetic.py" = ["E402"]
"scripts/entry_check.py" = ["E402"]
"scripts/eval_zero_shot.py" = ["E402"]
"scripts/freeze_testsets.py" = ["E402"]
"scripts/make_annotation_batch.py" = ["E402"]
"scripts/mine_sarcasm_candidates.py" = ["E402"]
"scripts/mine_sarcasm_holdout.py" = ["E402"]
"scripts/freeze_sarcasm_holdout.py" = ["E402"]
"scripts/make_review_sample.py" = ["E402"]
"scripts/make_synthetic_qa.py" = ["E402"]
"scripts/run_baseline.py" = ["E402"]
"scripts/tg_login.py" = ["E402"]
"scripts/train_xlmr_baseline.py" = ["E402"]
"scripts/validate_annotations.py" = ["E402"]
