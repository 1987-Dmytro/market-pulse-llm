# Stage-2 regional monitoring — the Poltava-oblast channels the sentinel watches.
#
# This file is OUTSIDE `config/registry.yaml` and is not a registry of sources. Ruling (ggg)
# 14.09 met the alternative and refused it: un-pausing these rows inside the registry breaks two
# seals (the LIVE-r2 pin family `eff8ba5b…` goes unreachable and `make check` reds; `tick.
# not_collected()` reads `collect` live, so `@telegraf_kremenchuk`'s 9 position rows return and the
# sealed `results/promo_screen_data.json` leaves `e45860c6…` with the published 1301 at 1310) — and
# collects nothing, because `collect_r2.py :: a1_sources()` takes bucket A only and regional is B.
# So this is the 04.09 (g) shape: a one-reader side file. No pin moves, no revision, no preflight
# change, and `config/registry.yaml` stays byte-identical to `eff8ba5b…`.
#
# READ BY EXACTLY TWO THINGS: `scripts/collect_region.py` (collects into `data/raw_region/`) and
# `scripts/region_sentinel.py` (scans for watchlist brands). No promo reader walks either this file
# or that root — region monitoring is a DIFFERENT population from the promo pipeline, and a reader
# that folded them would move a published number without naming it.
#
# `handle` is the store key: `data/raw_region/{posts,comments}/<handle without @>.jsonl`, and the
# same spelling the v1 archive used in 07–08.2026 (`data/raw/posts/PirOperative.jsonl` keeps its
# capitals). A channel re-spelled here is a SECOND channel to every reader downstream.
#
# The seventeen are the registry rows whose pause reads `deferred to phase B (ruling (ц) 30.08)` —
# printed and diffed in s61 against PHASE §2's expected set, which differs by one substitution:
# the phase named `dikankaa`, the registry carries `mo3ambik`. Both are here: `mo3ambik` because it
# is one of the seventeen, `dikankaa` as the eighteenth by ruling (ggg) 2.

channels:
  - handle: "@mo3ambik"
    note: "МОЗАМБІК.МЕДІА: Лубни, Пирятин, Хорол, Гребінка, Оржиця — five raiony in one feed"
