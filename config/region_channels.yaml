  - handle: "@LHVC_info"
    note: "Лохвиця.info — Lokhvytsia; 1 archive post, so its window starts effectively empty"
  - handle: "@KarlivkaLive"
    note: "Оголошення. Karlivka Live — Karlivka classifieds"
  - handle: "@poltava_pvp"
