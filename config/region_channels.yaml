  - handle: "@dikankaa"
    note: >-
      Диканька — the EIGHTEENTH, added by ruling (ggg) 2 and not a registry row at all.
      It was excluded from the promo registry on 2026-08-08 by the day-2 language census
      (`results/language_census_5c1_day2.json`: ru 20 of 30 decidable posts) and that exclusion
      stands for the promo pipeline. Regional monitoring reads Ukrainian AND Russian text for the
      same brand strings, so the census is not a reason to stop watching it; 30 v1 posts with 457
      replies are already on disk, and Telethon needs no registry row to collect more.
