  - handle: "@telegraf_kremenchuk"
    note: "Кременчуцький Телеграф — Kremenchuk; the one channel that also carries 9 promo position rows"
  - handle: "@gorishnie_plavni1"
    note: "Горішні Плавні — the raion's news feed"
  - handle: "@myrhorodtown"
