# Source registry — sources + category taxonomy + brand watchlist (docs/SPEC.md §3).
#
# Three entities, extended by editing this file only (no code changes):
#   sources   — Telegram channels to collect from, tagged by source_type
#   taxonomy  — tracked category groups; everything else is dropped by the T2a filter
#   watchlist — brands highlighted in analytics (coverage stays category-wide)

