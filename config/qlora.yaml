# Phase 4 QLoRA hyperparameters — FROZEN before 4c (docs/PROMPT-4b.md Step 2).
#
# One rationale per value is in knowledge/decisions/4b-training-contract.md; the
# short version is in the comments. Both ablation arms read this same file, and
# the only thing that differs between them is one data path, so anything changed
# here after 4c starts invalidates the comparison, not just a run.
#
# The base model and its NF4 quantization are NOT here: they live in
# src/market_pulse/local_llm.py, which eval, training and serving all read, and
# a second copy is how "train in the precision you serve" stops being true.

base:
  # The weights the 4a anchor was measured on. Pinned, not floating: a revision
  # bump between the anchor and the fine-tune would make the gates unpaired.
  revision: 842da3794eaa0b77d5f08bae87a17459d91ff475

lora:
  r: 16
  alpha: 32 # 2r, the usual QLoRA ratio: alpha/r = 2 is the scale the LR below assumes
  dropout: 0.05
  # Every attention and MLP projection of the language model. QLoRA's own result
  # is that adapting all linear layers, not just q/v, is what closes the gap to
  # full fine-tuning; at r=16 that is still ~0.2% of 31B parameters.
  target_suffixes: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  # Gemma 4 is an image-text model. The tower has linear layers of its own and we
  # train on text only — an adapter there would be untrained noise on the serving
  # path. The trainer refuses if these prefixes match nothing it can name.
  exclude_prefixes: [vision_tower, multi_modal_projector, vision_model]

optimizer:
  name: paged_adamw_8bit # paged: the 48 GB card must survive a long-sequence spike
  learning_rate: 0.0001 # 1e-4, the QLoRA default for r=16 adapters on an instruct base
  scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0 # LoRA B starts at zero; decaying it fights the only thing that learns
  max_grad_norm: 0.3

training:
  epochs: 2 # fixed, and NO early stopping: nothing may select against an eval (SPEC §5)
  # Measured, not guessed, twice. Under Phase 4's v1 prompts the longest of the
  # 2 795 scoreable rows rendered to 973 tokens and 1024 truncated nothing. 4.5h2
  # renders `T1v2_with_post` (SPEC amendment 3.9 (1) puts both arms on the
  # taxonomy-v2 sources, whose `service` rows the v1 parser refuses), and the post
  # travels in the request: the longest row is then 1 388 tokens and 79 of 4 743
  # cross 1024. Raised to 1 408 by operator decision of 2026-08-04, which is the
  # measured maximum plus a token of margin. This is a guard threshold, not a pad
  # width — `collate` pads to the longest row in each micro-batch — so raising it
  # changes no step time and no memory except on the batches that need it.
  # Truncating instead would teach a cut-off label on the rows richest in context.
  #
  # REVISION 2 (amendment 3.25 (1), operator, 2026-08-23): 1 408 -> 2 816 for the lora-c line. v3's
  # SFT rows carry a rationale per example on top of v2's two paragraphs and the widest is 2 759
  # tokens at the registered worst tokens-per-character, plus TEMPLATE_SLACK = 16, rounded up to a
  # multiple of 128. Same precedent shape as the 1 024 -> 1 408 raise of 2026-08-04 and the same
  # in-place revision of this file. Line B's pins on revision 1 are NOT re-taken: the sha256 in
  # results/prereg_lora_b.json, results/lora_b_verdict.json and results/pass1_sft.json now describe
  # revision 1 and join preflight's «carries an older pin» list, which is what a sealed record
  # doing its job looks like. Nothing of line B's data moves with the number — its longest kept row
  # is 1 222 tokens and it dropped 0 rows for length at 1 408, so it drops 0 at 2 816 too.
  max_seq_len: 2816
  micro_batch_size: 2
  grad_accum: 8 # effective batch 16; on OOM the trainer halves one and doubles the other
  seed: 42
  gradient_checkpointing: true
  log_every: 5 # optimizer steps between loss lines
  carve_every: 25 # optimizer steps between train-carve loss readings (thermometer only)
  save_every: 100 # adapter-only checkpoints, resumable
  # Held out of training by seed, drawn from the REAL pool before the synthetic
  # rows join, so both arms hold out exactly the same rows and the arms still
  # differ by exactly the 600 synthetic ids. It is a convergence thermometer and
  # a mechanics fixture; it selects nothing, and it never touches a frozen set.
  carve_rows: 24
